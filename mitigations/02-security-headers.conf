# ==============================================================================
# ApexPlanet Cybersecurity Internship - Task 5 Remediation
# Config: 02-security-headers.conf
# Purpose: Enforce HTTP security headers to protect browser clients
# ==============================================================================

<IfModule mod_headers.c>
    # Enforce HTTPS transport policy (1 year duration with subdomains)
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"

    # Restrict unauthorized client hardware features
    Header always set Permissions-Policy "geolocation=(), microphone=(), camera=()"

    # Prevent clickjacking by restricting framing to identical origins
    Header always set X-Frame-Options "SAMEORIGIN"

    # Prevent MIME-type sniffing
    Header always set X-Content-Type-Options "nosniff"

    # Referrer privacy protection
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
</IfModule>
